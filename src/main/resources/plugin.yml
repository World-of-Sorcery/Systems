name: Systems
version: '${project.version}'
main: me.hektortm.woSSystems.WoSSystems
api-version: '1.21.8'
author: HektorTM
depend: [Core, WorldGuard, Citizens]
commands:
  debugcmd:
    description: Debug command
    usage: /<command> <player>
  wosdebug:
    description: debug mode for staff (interaction labels, raw GUI placeholders, action output)
    usage: /<command>
  woshelp:
    description: every command you may use
    usage: /<command> [page|word]
    aliases: [ staffhelp ]
  # Console only (server console / RCON, used by the API's release run). The node is
  # granted to nobody (default false) so players don't see /wos in tab completion; the
  # executor refuses every non-console sender anyway.
  wos:
    description: network console commands (console only)
    usage: /<command> sendall <hub|backend|staging|live>
    permission: wos.console
  # Interaction Commands
  interaction:
    description: trigger interactions and bind them to blocks and NPCs
    usage: /<command> <trigger|bind|unbind|npcbind|npcunbind|info|help>
    permission: interaction
    aliases: [ inter ]
  # Citem Commands
  citem:
    description: inspect, give and remove custom items
    usage: /<command> <info|give|remove|help>
  cgive:
    description: give a citem
    permission: citem.give
    usage: /<command> <player> <ID> [amount]
  cremove:
    description: remove a citem
    permission: citem.remove
    usage: /<command> <player> <ID> [amount]
  sign:
    description: sign item
    permission: citem.sign
    usage: /<command>
  # Stat Commands
  stats:
    description: Stats Command
    permission: stats.create
    usage: /<command> <create|delete|give|take|set|reset|view|reload|>
  globalstats:
    description: global stats command
    permission: stats_global.create
    usage: /<command>
  # Unlockable Commands
  unlockable:
    description: Unlockable Command
    permission: unlockable.create
    usage: /<command> <give|take>
  # Economy Commands
  economy:
    aliases: [ eco ]
    usage: /<command>
    description: Economy
    permission: economy.modify.give
  balance:
    aliases: [ bal ]
    description: Shows your or a players balance
    usage: /<command> [player]
    permission: economy.balance.self
  pay:
    description: Pay another player
    usage: /pay <player> <currency> <amount>
    permission: economy.pay
  baltop:
    aliases: [ balancetop ]
    description: The richest players of a currency
    usage: /baltop [currency] [page]
    permission: economy.baltop
  coinflip:
    description: GAMBLING
    usage: /coinflip <amount> <heads|tails>
    permission: economy.coinflip
  # Chat System Commands
  nickname:
    aliases: [nick]
    description: nick
    permission: nick.request.send
    usage: /<command>
  realname:
    description: realname
    usage: /<command> <input>
  msg:
    aliases: [ tell, w, whisper ]
    description: a private message to a player on any server
    usage: /<command> <player> <message>
    permission: chat.msg
  r:
    aliases: [ reply ]
    description: answer the last player you messaged or got a message from
    usage: /<command> <message>
    permission: chat.msg
  # Loottable Commands
  bug:
    description: Report a bug to the team
    usage: /bug
  loottable:
    aliases: [lt]
    description: roll loot tables for players
    permission: loottable.give
    usage: /<command> <trigger|chest|help>
  # Time Commands
  time:
    description: View and manipulate the time
    usage: /<command> [date|reload|freeze]
# Cosmetic Commands
  cosmetic:
    description: cosmetic management
    usage: /<command>
  prefixes:
    description: open Prefix Menu
    uasge: /<command>
    aliases: [prefix]
  badges:
    description: open Badge Menu
    uasge: /<command>
    aliases: [badge]
  titles:
    description: open Title Menu
    uasge: /<command>
  # Profile Command
  profile:
    description: profile
    usage: /<command> [player]

  gui:
    description: open GUIs for players
    usage: /<command> <open|playerview|help> <player> <id>

  cscreen:
    description: open custom screens (built in the portal) for players
    usage: /<command> <open|close|help> <player> [id]
    aliases: [cs]

  cooldown:
    description: cooldown management
    usage: /<command> <give|remove|view> <player> <id>
    aliases: [cd]

  calendar:
    aliases: [calender, cal]
    description: calendar management
    usage: /<command> <view|set> [date]

  link:
    description: link management
    usage: /<command> <website|discord> [code]
    permission:

  dialog:
    description: Dialog Command
    usage: /<command> <start|stop|reload> [player|id]

  quest:
    description: Your quests and sequences (status, cancel, abandon); staff start and reset them
    usage: /<command> <status|cancel|abandon|start|reset|help> [args]
  spell:
    description: 'Spells: teach, take away, cast as a player, test a draft, list, change XP and levels'
    usage: /<command> <learn|forget|cast|test|list|xp|level|help> [args]
  mana:
    description: Set, give or take a player's mana or max mana
    usage: /<command> <set|give|take|max|help> [args]
  wand:
    description: 'Your wand: get it back and pick its look; staff give wands and set colour or skin'
    usage: /<command> [give|restore|colour|skin|help] [args]
  spells:
    description: Your spellbook (which spell sits on which ring key)
    usage: /<command>

# Every node the plugin checks, with what it allows. WoSCore sends this list to
# wos-api at server start; the portal shows it (Permissions > Nodes). Keep it
# equal to the Permissions enum (PluginYmlTest checks).
permissions:
  citem.give:
    description: 'Give custom items to players (/cgive, /citem give).'
  citem.remove:
    description: 'Take custom items from players (/cremove, /citem remove).'
  citem.info:
    description: 'See the custom item data of the item in your hand (/citem info).'
  interaction.bind:
    description: 'Bind interactions to blocks and NPCs (/interaction bind, npcbind).'
  interaction.unbind:
    description: 'Remove interaction bindings from blocks and NPCs (/interaction unbind, npcunbind).'
  interaction.trigger:
    description: 'Run an interaction for a player (/interaction trigger).'
  interaction.info:
    description: 'See which interaction is bound to a block or NPC (/interaction info).'
  gui.open:
    description: 'Open a GUI for a player by command (/gui open). Content runs it as the console, which needs no node.'
  gui.playerview:
    description: 'Look at a GUI the way another player sees it (/gui playerview).'
  cscreen.open:
    description: 'Open a custom screen for a player (/cscreen open).'
  cscreen.close:
    description: 'Close a player''s custom screen (/cscreen close).'
  debug.use:
    description: 'Turn on debug mode: interaction labels, raw GUI placeholders, action output (/wosdebug).'
  woshelp.use:
    description: 'List every staff command you may use (/woshelp).'
  wos.console:
    description: 'Not for players: hides the console-only /wos (release run) from tab completion. The command refuses every player, even with this node.'
    default: false
  spell.learn:
    description: 'Teach a player a spell or take it away (/spell learn|forget).'
  spell.cast:
    description: 'Cast a spell as a player, from content or by hand (/spell cast).'
  spell.test:
    description: 'Cast a spell draft that is not published yet (/spell test).'
  spell.list:
    description: 'List the spells a player knows, or every spell (/spell list).'
  spell.progress:
    description: 'Give or take spell XP, or set a spell level of a player (/spell xp|level).'
  mana.set:
    description: 'Set, give or take a player''s mana and max mana (/mana).'
  wand.give:
    description: 'Give a player their wand or give it back (/wand give|restore).'
  wand.manage:
    description: 'Change a player''s wand colour or skin (/wand colour|skin).'
  stats.modify.give:
    description: 'Add to a player''s stat (/stats give).'
  stats.modify.take:
    description: 'Subtract from a player''s stat (/stats take).'
  stats.modify.set:
    description: 'Set a player''s stat (/stats set).'
  stats.modify.reset:
    description: 'Reset a player''s stat (/stats reset).'
  stats.view:
    description: 'See a player''s stats (/stats view, /globalstats view).'
  stats_global.modify.give:
    description: 'Add to a global stat (/globalstats give).'
  stats_global.modify.take:
    description: 'Subtract from a global stat (/globalstats take).'
  stats_global.modify.set:
    description: 'Set a global stat (/globalstats set).'
  stats_global.modify.reset:
    description: 'Reset a global stat (/globalstats reset).'
  stats_global.view:
    description: 'See the global stats (/globalstats).'
  unlockable.modify.give:
    description: 'Give a player an unlockable (/unlockable give).'
  unlockable.modify.take:
    description: 'Take an unlockable from a player (/unlockable take).'
  economy.balance.self:
    description: 'See your own balance (/balance).'
  economy.balance.others:
    description: 'See another player''s balance (/balance <player>, /eco).'
  economy.modify.give:
    description: 'Give a player money (/eco give).'
  economy.modify.take:
    description: 'Take money from a player (/eco take).'
  economy.modify.set:
    description: 'Set a player''s balance (/eco set).'
  economy.modify.reset:
    description: 'Reset a player''s balance (/eco reset).'
  economy.modify.random:
    description: 'Give a player a random amount (/eco random).'
  economy.modify.currencies:
    description: 'List the currencies (/eco currencies).'
  economy.coinflip:
    description: 'Bet money on a coin flip (/coinflip).'
  economy.pay:
    description: 'Pay another player (/pay).'
  economy.baltop:
    description: 'See the richest players of a currency (/baltop).'
  nick.request.send:
    description: 'Ask for a nickname (/nick).'
  nick.request.view:
    description: 'See open nickname requests (/nick requests).'
  nick.reserve:
    description: 'Reserve a nickname (/nick reserve).'
  nick.unreserve:
    description: 'Release a reserved nickname (/nick unreserve).'
  nick.reset:
    description: 'Reset a player''s nickname (/nick reset).'
  chat.msg:
    description: 'Send private messages to players on any server (/msg, /r).'
    default: true
  cosmetic.give:
    description: 'Give a player a cosmetic (/cosmetic give).'
  cosmetic.take:
    description: 'Take a cosmetic from a player (/cosmetic take).'
  cosmetic.set:
    description: 'Set the cosmetic a player shows (/cosmetic set).'
  dialog.trigger:
    description: 'Start or stop a dialog for a player (/dialog).'
  loottable.give:
    description: 'Roll a loot table for a player (/loottable trigger). Also needed for /loottable at all.'
  loottable.chest:
    description: 'Turn a chest into a loot table chest (/loottable chest).'
  cooldowns.give:
    description: 'Start a cooldown for a player (/cooldown give).'
  cooldowns.remove:
    description: 'Remove a player''s cooldown (/cooldown remove).'
  cooldowns.view:
    description: 'See a player''s cooldowns (/cooldown view).'
  time.date:
    description: 'See the in-game date (/time date).'
  time.freeze:
    description: 'Freeze and unfreeze the in-game time (/time freeze).'
  wossystems.debug.use:
    description: 'Run the developer test command (/debugcmd).'
  quest.admin.start:
    description: 'Start and reset quests for players (/quest start, /quest reset).'
